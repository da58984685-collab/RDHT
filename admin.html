<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>赤月 관리자</title>
<style>
:root{--bg1:#0a0607;--card:#140d0f;--field:#0b0708;--text:#f3e9e7;--sub:#ab9d9b;--line:#3a1a1e;--red:#d4202e;--red2:#ff3b4a;--ok:#8fb996;--warn:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg1);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;font-size:15px}
h1,h2,h3{margin:0;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
input,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--red)}
.btn{white-space:nowrap;flex:none;background:var(--red);border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font-weight:700;color:#fff}
.btn:hover{background:var(--red2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
.btn.ghost:hover{border-color:var(--red)}
.err{color:var(--red2);min-height:1.4em;font-size:.9rem;margin-top:8px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .card{width:100%;max-width:360px;display:grid;gap:12px}
#login h1{font-family:"Noto Serif TC","Nanum Myeongjo",serif;letter-spacing:.2em;text-align:center;font-size:1.6rem}
#login small{display:block;text-align:center;color:var(--sub)}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-family:"Noto Serif TC","Nanum Myeongjo",serif;letter-spacing:.14em;font-size:1.3rem}
.top h1 span{color:var(--red2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem}
.stat span{color:var(--sub);font-size:.8rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.search{display:flex;gap:8px;margin-bottom:10px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#1b1013;color:var(--sub);font-weight:500}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:#22101400;background:#2a1216}
.rk{display:inline-block;min-width:1.6em;text-align:center;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-weight:700}
.rk.S,.rk.A{color:var(--red2);border-color:var(--red)}
.muted{color:var(--sub)}
.empty{color:var(--sub);padding:18px;text-align:center}
/* detail */
.head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.head img,.head .ph{width:84px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:var(--field);flex:none}
.head h2{font-size:1.25rem}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:.9rem;margin-bottom:10px}
.kv dt{color:var(--sub)}.kv dd{margin:0;word-break:break-word}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--red)}
.bars{display:grid;gap:6px;margin-bottom:8px}
.bar{display:grid;grid-template-columns:64px 1fr 36px;gap:8px;align-items:center;font-size:.88rem}
.bar i{display:block;height:8px;background:var(--field);border-radius:4px;overflow:hidden}
.bar i b{display:block;height:100%;background:#e8e2e0}
.bar.pw i b{background:var(--red)}
.ok{color:var(--ok)}.bad{color:var(--red2)}.wait{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:.82rem}
.send{margin-top:14px}
.send textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.note{font-size:.82rem;color:var(--sub);margin-top:8px}
.found{display:grid;gap:8px;margin-bottom:12px}
.fc{border:1px solid var(--red);border-radius:6px;padding:10px 12px;cursor:pointer;background:#1b0d10}
.fc:hover{background:#26111500;background:#2a1216}
.fc h4{margin:0 0 6px;font-size:1rem}
.fc dl{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;margin:0;font-size:.88rem}
.fc dt{color:var(--sub)}.fc dd{margin:0}
.edit-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dirty{color:var(--warn);font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:default}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.fld{display:grid;gap:3px;font-size:.82rem;color:var(--sub)}
.fld input{font-size:.95rem}
.danger{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;border:1px solid #6b1820;border-radius:6px;background:#1a0b0e;flex-wrap:wrap}
.btn.dbtn{background:transparent;border:1px solid var(--red);color:var(--red2)}
.btn.dbtn:hover{background:var(--red);color:#fff}
.dirty{color:var(--warn)}
.fld.wide{grid-column:1/-1}
.fld select,.fld textarea{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 10px;color:var(--text);font:inherit;width:100%}
.fld textarea{resize:vertical}
.mini{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:5px 7px;width:80px;color:var(--text)}
.mini.w{width:130px}
select.mini{width:auto}
.btn.sm{padding:5px 10px;font-size:.82rem}
.addrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.addrow input{flex:1;min-width:120px}
td input[type=checkbox]{width:auto}
</style>
</head>
<body>
<section id="login">
  <form class="card" id="lf" autocomplete="off">
    <h1>赤月</h1>
    <small>관리자 전용</small>
    <input id="aid" placeholder="아이디" autocomplete="username" required>
    <input id="apw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn" type="submit">접속</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
</section>

<main id="app" class="wrap hide">
  <div class="top">
    <h1>赤月 <span>관리자</span></h1>
    <div><span class="muted" id="last" style="font-size:.82rem;margin-right:8px"></span><label class="muted" style="font-size:.82rem;margin-right:8px;cursor:pointer"><input type="checkbox" id="auto" checked style="width:auto;vertical-align:middle"> 1분마다 자동 새로고침</label><button class="btn ghost" id="refresh" type="button">새로고침</button> <button class="btn ghost" id="logout" type="button">로그아웃</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cols">
    <section class="card">
      <h2 style="margin-bottom:10px">헌터 목록</h2>
      <form class="search" id="sf"><input id="q" autocomplete="off" name="hunter-search" placeholder="헌터 이름을 입력하세요"><button class="btn" type="submit">검색</button></form>
      <div id="found"></div>
      <div class="tw"><table><thead><tr><th>헌터</th><th>등급</th><th>Lv</th><th>토벌</th><th>지역</th></tr></thead><tbody id="plist"></tbody></table></div>
      <div class="note">행을 누르면 상세 정보가 열립니다.</div>
    </section>
    <section class="card" id="detail"><div class="empty">왼쪽 목록에서 헌터를 선택하세요.</div></section>
  </div>
  <section class="card" id="recbox">
    <h3 style="margin-bottom:8px">오늘의 추천 <span class="muted" style="font-weight:400;font-size:.85rem">(게임 캐릭터 창에 표시 · 관리자만 수정 가능)</span></h3>
    <div class="row">
      <select id="rregion" aria-label="추천 지역"><option value="">추천 지역 없음</option></select>
      <input id="rtime" maxlength="20" placeholder="추천 시간대 (예: 21시 무렵)">
      <input id="rtip" maxlength="100" placeholder="한 줄 조언 (최대 100자)" style="flex:2;min-width:200px">
    </div>
    <div class="row"><button class="btn" id="rsave" type="button">저장</button><button class="btn" id="rclear" type="button">삭제</button><span id="rmsg" class="muted"></span></div>
  </section>
  <section class="card" id="shop">
    <h3 style="margin-bottom:8px">상점 관리 <span class="muted" style="font-weight:400;font-size:.85rem">(게임 내 기기 → 상점에 표시)</span></h3>
    <div class="row"><input id="sname" maxlength="30" placeholder="아이템 이름 (최대 30자)"><input id="sdesc" maxlength="100" placeholder="설명 (선택, 최대 100자)"><input id="sprice" type="number" min="0" max="9999999" step="1" placeholder="가격 (G)" style="max-width:110px"><button class="btn" id="sadd" type="button">추가</button><span id="smsg" class="muted"></span></div>
    <div class="tw"><table><thead><tr><th>아이템</th><th>설명</th><th>가격 (G)</th><th></th></tr></thead><tbody id="slist"></tbody></table></div>
  </section>
  <section class="card send">
    <h3 style="margin-bottom:8px">시스템 알림 발송 <span class="muted" style="font-weight:400;font-size:.85rem">(서버 내 모든 헌터에게 전달)</span></h3>
    <textarea id="ntext" maxlength="1000" placeholder="알림 내용 (최대 1000자)"></textarea>
    <div class="row"><button class="btn" id="nsend" type="button">발송</button><span id="nmsg" class="muted"></span></div>
  </section>
</main>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function api(m,u,b){
  return fetch(u,{method:m,credentials:"same-origin",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(j){j._status=r.status;return j})})
    .catch(function(){return{error:"network",_status:0}});
}
function dt(t){if(!t)return"-";var d=new Date(t),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
var RES={success:["토벌 성공","ok"],fail:["토벌 실패","bad"],pending:["S급 결과 대기","wait"]};
var selCode=null,tab="info",cache=null,dirty=false;
function powNeedOf(lv){return Math.round(30*Math.pow(lv,1.6))}
function okLeave(){return !dirty||confirm("저장하지 않은 변경 내용이 사라집니다. 계속할까요?")}

function showApp(on){$("login").classList.toggle("hide",on);$("app").classList.toggle("hide",!on)}

$("lf").addEventListener("submit",function(e){
  e.preventDefault();$("lerr").textContent="";
  api("POST","/api/admin/login",{id:$("aid").value,password:$("apw").value}).then(function(r){
    if(r.ok){$("apw").value="";boot()}
    else if(r._status===404)$("lerr").textContent="서버에 관리자 기능이 없습니다(404). api 폴더의 파일을 최신으로 교체해 주세요.";
    else $("lerr").textContent=r.error==="rate_limited"?"시도 횟수가 많습니다. 잠시 후 다시 시도하세요.":r.error==="admin_disabled"?"관리자 계정이 설정되지 않았습니다.":r.error==="network"?"네트워크 오류입니다.":"아이디 또는 비밀번호가 올바르지 않습니다.";
  });
});
$("logout").addEventListener("click",function(){api("POST","/api/admin/logout",{}).then(function(){location.reload()})});
$("refresh").addEventListener("click",function(){loadAll()});
$("sf").addEventListener("submit",function(e){e.preventDefault();loadList()});

function loadOverview(){
  api("GET","/api/admin/overview").then(function(r){
    if(r._status===401){showApp(false);return}
    var rk={};(r.ranks||[]).forEach(function(x){rk[x.rank]=x.c});
    var h={};(r.hunts||[]).forEach(function(x){h[x.result]=x.c});
    var cells=[["전체 헌터",r.users],["토벌 성공",h.success||0],["토벌 실패",h.fail||0],["S급 결과 대기",r.pendingS],["발송한 알림",r.notices],
      ["등급 분포","F"+(rk.F||0)+" E"+(rk.E||0)+" D"+(rk.D||0)+" C"+(rk.C||0)+" B"+(rk.B||0)+" A"+(rk.A||0)]];
    $("stats").innerHTML=cells.map(function(c){return'<div class="stat"><b>'+esc(c[1])+"</b><span>"+esc(c[0])+"</span></div>"}).join("");
  });
}
function loadList(){
  api("GET","/api/admin/players?q="+encodeURIComponent($("q").value)).then(function(r){
    if(r._status===401){showApp(false);return}
    var ps=r.players||[];
    var qv=$("q").value.trim();
    $("found").innerHTML=qv?(ps.length?'<div class="found">'+ps.slice(0,5).map(function(p){
      return'<div class="fc" data-c="'+esc(p.code)+'"><h4>'+esc(p.hunterName)+'</h4><dl><dt>고유 코드</dt><dd>'+esc(p.code)+'</dd><dt>등급</dt><dd><span class="rk '+esc(p.rank)+'">'+esc(p.rank)+'</span></dd><dt>레벨</dt><dd>Lv.'+p.lv+'</dd><dt>토벌 지역</dt><dd>'+esc(p.region)+(p.lastRegion?' <span class="muted">(최근 토벌: '+esc(p.lastRegion)+')</span>':'')+'</dd></dl></div>';
    }).join("")+(ps.length>5?'<div class="muted" style="font-size:.82rem">외 '+(ps.length-5)+'명 — 아래 목록에서 확인하세요.</div>':"")+"</div>":'<div class="empty">"'+esc(qv)+'" 헌터를 찾지 못했습니다.</div>'):"";
    $("plist").innerHTML=ps.length?ps.map(function(p){
      return'<tr data-c="'+esc(p.code)+'"'+(p.code===selCode?' class="sel"':"")+"><td>"+esc(p.hunterName)+'<div class="muted" style="font-size:.78rem">'+esc(p.code)+'</div></td><td><span class="rk '+esc(p.rank)+'">'+esc(p.rank)+"</span></td><td>"+p.lv+"</td><td>"+p.kills+"</td><td>"+esc(p.region)+"</td></tr>";
    }).join(""):'<tr><td colspan="5" class="empty">헌터가 없습니다.</td></tr>';
  });
}
function pick(el){
  var c=el.getAttribute("data-c");
  if(c!==selCode&&!okLeave())return;
  if(c!==selCode)dirty=false;
  selCode=c;tab="info";
  Array.prototype.forEach.call($("plist").children,function(x){x.classList.toggle("sel",x.getAttribute("data-c")===selCode)});
  loadDetail();
}
$("plist").addEventListener("click",function(e){var tr=e.target.closest("tr[data-c]");if(tr)pick(tr)});
$("found").addEventListener("click",function(e){var c=e.target.closest(".fc");if(c)pick(c)});
var qt=null;
$("q").addEventListener("input",function(){clearTimeout(qt);qt=setTimeout(loadList,300)});   // 입력하면 바로 검색
function loadDetail(){
  if(!selCode)return;
  api("GET","/api/admin/player?code="+encodeURIComponent(selCode)).then(function(r){
    if(r._status===401){showApp(false);return}
    if(r.error){$("detail").innerHTML='<div class="empty">정보를 불러오지 못했습니다.</div>';return}
    cache=r;renderDetail();
  });
}
function table(cols,rows,emptyMsg){
  if(!rows.length)return'<div class="empty">'+esc(emptyMsg)+"</div>";
  return'<div class="tw" style="max-height:340px"><table><thead><tr>'+cols.map(function(c){return"<th>"+esc(c)+"</th>"}).join("")+"</tr></thead><tbody>"+rows.join("")+"</tbody></table></div>";
}
function renderDetail(){
  var r=cache,p=r.player,st=p.stats||{};
  var counts={};(r.counts||[]).forEach(function(x){counts[x.result]=x.c});
  var h='<div class="head">'+(p.image?'<img alt="" src="'+esc(p.image)+'">':'<div class="ph"></div>')+
    '<div><h2>'+esc(p.hunterName)+' <span class="rk '+esc(p.rank)+'">'+esc(p.rank)+'</span></h2><div class="muted">'+esc(p.code)+" · Lv."+p.lv+" · EXP "+p.exp+"</div></div></div>";
  h+='<div class="tabs">'+[["info","정보 · 스탯"],["items","아이템"],["acq","습득 정보"],["hunt","토벌 기록"]].map(function(t){return'<button class="tab'+(tab===t[0]?" on":"")+'" data-t="'+t[0]+'" type="button">'+t[1]+"</button>"}).join("")+"</div>";
  var opt=function(list,cur){return list.map(function(x){return'<option value="'+esc(x[0])+'"'+(x[0]===cur?" selected":"")+">"+esc(x[1])+"</option>"}).join("")};
  var RANKS=["F","E","D","C","B","A","S"].map(function(x){return[x,x]});
  if(tab==="info"){
    h+='<dl class="kv"><dt>현재 지역</dt><dd>'+esc(p.region)+"</dd><dt>친구 수</dt><dd>"+p.friends+"명</dd><dt>가입일</dt><dd>"+dt(p.created)+"</dd></dl>";
    var f=function(id,label,val,min,max,type){return'<label class="fld"><span>'+label+'</span><input id="'+id+'" type="'+(type||"number")+'" value="'+esc(val)+'"'+(type==="text"?' maxlength="30"':' min="'+min+'" max="'+max+'" step="1"')+' autocomplete="off"></label>'};
    h+='<h3 style="font-size:.95rem;margin:12px 0 8px">헌터 정보 수정 <span class="muted" style="font-weight:400;font-size:.8rem">(저장 버튼을 눌러야 서버에 반영됩니다)</span></h3>'+
      '<form id="editf" class="egrid">'+
      f("e_name","이름",p.name,0,0,"text")+
      '<label class="fld"><span>성별</span><select id="e_gender">'+opt([["여성","여성"],["남성","남성"],["기타","기타"]],p.gender)+"</select></label>"+
      f("e_age","나이",p.age,1,999)+
      f("e_hn","헌터 네임",p.hunterName,0,0,"text")+
      '<label class="fld"><span>헌터 등급</span><select id="e_rank">'+opt(RANKS,p.rank)+"</select></label>"+
      f("e_lv","전투력(레벨)",p.lv,1,999)+f("e_exp","EXP (0~"+(powNeedOf(p.lv)-1)+")",p.exp,0,powNeedOf(p.lv)-1)+
      f("e_gold","보유 골드 (G)",p.gold||0,0,99999999)+f("e_hp","체력",st.hp,0,9999)+f("e_str","근력",st.str,0,9999)+f("e_agi","민첩",st.agi,0,9999)+f("e_luck","행운",st.luck,0,9999)+'<label class="fld"><span>오염도 (%, 0~100)</span><input id="e_taint" type="number" min="0" max="100" step="0.1" value="'+esc(st.taint||0)+'" autocomplete="off"></label>'+
      '<label class="fld wide"><span>성격 (최대 1000자)</span><textarea id="e_pers" rows="3" maxlength="1000">'+esc(p.personality)+"</textarea></label>"+
      '<label class="fld wide"><span>특징 (한 줄에 하나, 최대 5개 · 각 50자)</span><textarea id="e_traits" rows="3">'+esc((p.traits||[]).join("\n"))+"</textarea></label>"+
      "</form>"+
      '<div class="row"><button class="btn" id="e_save" type="button">저장</button><button class="btn ghost" id="e_reset" type="button">되돌리기</button><span id="e_msg" class="muted"></span></div>'+
      '<div class="danger"><div><b>강제 탈퇴</b><div class="muted" style="font-size:.82rem">캐릭터와 토벌·습득·친구·메시지 기록이 서버에서 영구 삭제됩니다.</div></div><button class="btn dbtn" id="e_del" type="button">강제 탈퇴</button></div>';
    if(r.pendingS&&r.pendingS.length)h+='<h3 style="font-size:.95rem;margin:10px 0 4px">S급 결과 대기</h3>'+r.pendingS.map(function(x){return'<div class="muted">'+esc(x.mon)+" — "+dt(x.at)+" 공개</div>"}).join("");
  }else if(tab==="items"){
    h+='<div class="addrow"><input id="i_name" placeholder="아이템 이름" maxlength="30"><input id="i_qty" type="number" min="1" max="9999" value="1" style="max-width:90px"><button class="btn" data-act="item-add" type="button">추가 / 수량 변경</button></div>';
    h+=table(["아이템","수량",""],(r.items||[]).map(function(i){return'<tr data-item="'+esc(i.item)+'"><td>'+esc(i.item)+'</td><td><input class="mini" type="number" min="1" max="9999" value="'+i.qty+'" data-k="qty"></td><td><button class="btn ghost sm" data-act="item-save" type="button">저장</button> <button class="btn dbtn sm" data-act="item-del" type="button">삭제</button></td></tr>'}),"보유한 아이템이 없습니다. 위에서 추가할 수 있습니다.");
    if((r.items||[]).length)h+='<div class="row"><button class="btn dbtn sm" data-act="item-clear" type="button">아이템 전체 삭제</button></div>';
  }else if(tab==="acq"){
    h+=table(["","시각","종류","내용","수량","출처"],(r.acquired||[]).map(function(a){return'<tr data-id="'+a.id+'"><td><input type="checkbox" data-k="sel"></td><td>'+dt(a.at)+"</td><td>"+(a.kind==="exp"?"경험치":a.kind==="gold"?"골드":esc(a.kind))+"</td><td>"+esc(a.name)+"</td><td>"+a.qty+"</td><td>"+esc(a.source)+"</td></tr>"}),"습득 기록이 없습니다.");
    if((r.acquired||[]).length)h+='<div class="row"><button class="btn dbtn sm" data-act="acq-del" type="button">선택 삭제</button><button class="btn dbtn sm" data-act="acq-clear" type="button">전체 삭제</button></div>';
  }else{
    h+='<div class="chips"><span class="chip ok">성공 '+(counts.success||0)+'</span><span class="chip bad">실패 '+(counts.fail||0)+'</span><span class="chip wait">S급 대기 '+(counts.pending||0)+"</span></div>";
    var RS=[["success","성공"],["fail","실패"],["pending","S급 대기"]];
    h+=table(["시각","몬스터","등급","결과","EXP",""],(r.hunts||[]).map(function(x){return'<tr data-id="'+x.id+'"><td>'+dt(x.at)+'</td><td><input class="mini w" data-k="mon" maxlength="30" value="'+esc(x.mon)+'"></td><td><select class="mini" data-k="rank">'+opt(RANKS,x.rank)+'</select></td><td><select class="mini" data-k="result">'+opt(RS,x.result)+'</select></td><td><input class="mini" type="number" min="0" max="99999" data-k="exp" value="'+x.exp_gain+'"></td><td><button class="btn ghost sm" data-act="hunt-save" type="button">저장</button> <button class="btn dbtn sm" data-act="hunt-del" type="button">삭제</button></td></tr>'}),"토벌 기록이 없습니다.");
    if((r.hunts||[]).length)h+='<div class="row"><button class="btn dbtn sm" data-act="hunt-clear" type="button">토벌 기록 전체 삭제</button></div>';
    h+='<div class="note">최근 200건까지 표시합니다. 기록을 바꾸거나 지워도 헌터의 레벨·경험치·토벌 완료 상태는 바뀌지 않습니다. (그 값은 "정보 · 스탯" 탭에서 수정하세요)</div>';
  }
  $("detail").innerHTML=h;
}
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});
$("detail").addEventListener("click",function(e){
  var t=e.target,b=t.closest(".tab");
  if(b&&cache){if(!okLeave())return;dirty=false;tab=b.getAttribute("data-t");renderDetail();return}
  if(t.id==="e_save")return saveEdit();
  if(t.id==="e_reset"){if(okLeave()){dirty=false;renderDetail()}return}
  if(t.id==="e_del")return delPlayer();
  var act=t.getAttribute&&t.getAttribute("data-act");if(act)rowAct(act,t);
});
function onEdit(e){
  if(!e.target.closest("#editf"))return;
  dirty=true;var m=$("e_msg");if(m){m.className="dirty";m.textContent="저장하지 않은 변경 사항이 있습니다."}
}
$("detail").addEventListener("input",onEdit);
$("detail").addEventListener("change",onEdit);
var EMSG={bad_gold:"골드는 0~99,999,999 사이 정수여야 합니다.",bad_price:"가격은 0~9,999,999 사이 정수여야 합니다.",bad_hunter_name:"헌터 네임은 2~12자여야 합니다.",bad_name:"이름은 1~30자여야 합니다.",bad_gender:"성별 값이 올바르지 않습니다.",bad_age:"나이는 1~999 사이 정수여야 합니다.",bad_personality:"성격은 1~1000자여야 합니다.",bad_traits:"특징은 최대 5개, 각 50자 이하여야 합니다.",bad_rank:"등급 값이 올바르지 않습니다.",bad_lv:"레벨은 1~999 사이 정수여야 합니다.",bad_exp:"EXP 범위를 벗어났습니다.",bad_stat:"스탯은 0~9999 사이 정수여야 합니다.",bad_item:"아이템 이름은 1~30자여야 합니다.",bad_qty:"수량은 1~9999 사이 정수여야 합니다.",bad_mon:"몬스터 이름은 1~30자여야 합니다.",bad_result:"결과 값이 올바르지 않습니다.",no_ids:"삭제할 항목을 선택하세요.",not_found:"대상을 찾을 수 없습니다.",unauthorized:"로그인이 만료되었습니다.",rate_limited:"요청이 많습니다."};
function saveEdit(){
  var m=$("e_msg"),v=function(i){return $(i).value};
  m.className="muted";m.textContent="저장 중...";
  api("POST","/api/admin/player/update",{code:selCode,hunterName:v("e_hn"),name:v("e_name"),gender:v("e_gender"),age:Number(v("e_age")),rank:v("e_rank"),
    personality:v("e_pers"),traits:v("e_traits").split("\n").map(function(x){return x.trim()}).filter(Boolean),
    lv:Number(v("e_lv")),exp:Number(v("e_exp")),gold:Number(v("e_gold")),
    stats:{hp:Number(v("e_hp")),str:Number(v("e_str")),agi:Number(v("e_agi")),luck:Number(v("e_luck")),taint:Number(v("e_taint"))}}).then(function(r){
    if(r._status===401){showApp(false);return}
    if(r.ok){dirty=false;loadAll();setTimeout(function(){var mm=$("e_msg");if(mm){mm.className="ok";mm.textContent="저장했습니다. 게임에는 다음 갱신(5초 이내)부터 반영됩니다."}},400)}
    else{m.className="bad";m.textContent=(EMSG[r.error]||"저장하지 못했습니다.")+(r.error==="bad_exp"&&r.max!=null?" (최대 "+r.max+")":"")}
  });
}
// 아이템 · 습득 정보 · 토벌 기록: 행마다 바로 서버에 반영됩니다 (삭제는 확인창을 거칩니다)
function post(url,body,okf){
  body.code=selCode;
  api("POST",url,body).then(function(r){
    if(r._status===401){showApp(false);return}
    if(r.ok){loadDetail();loadList();if(okf)okf()}else alert(EMSG[r.error]||"처리하지 못했습니다.");
  });
}
function rowAct(act,btn){
  var tr=btn.closest("tr"),val=function(k){var el=tr&&tr.querySelector('[data-k="'+k+'"]');return el?el.value:""};
  if(act==="item-add"){post("/api/admin/player/item",{item:$("i_name").value.trim(),qty:Number($("i_qty").value)});return}
  if(act==="item-save"){post("/api/admin/player/item",{item:tr.getAttribute("data-item"),qty:Number(val("qty"))});return}
  if(act==="item-del"){if(confirm("'"+tr.getAttribute("data-item")+"' 아이템을 삭제할까요?"))post("/api/admin/player/item/delete",{item:tr.getAttribute("data-item")});return}
  if(act==="item-clear"){if(confirm("이 헌터의 아이템을 모두 삭제할까요?"))post("/api/admin/player/item/delete",{all:true});return}
  if(act==="acq-del"){
    var ids=Array.prototype.map.call($("detail").querySelectorAll('tr[data-id] [data-k="sel"]:checked'),function(c){return Number(c.closest("tr").getAttribute("data-id"))});
    if(!ids.length){alert("삭제할 항목을 선택하세요.");return}
    if(confirm("선택한 습득 기록 "+ids.length+"건을 삭제할까요?"))post("/api/admin/player/acquired/delete",{ids:ids});return}
  if(act==="acq-clear"){if(confirm("이 헌터의 습득 기록을 모두 삭제할까요?"))post("/api/admin/player/acquired/delete",{all:true});return}
  if(act==="hunt-save"){post("/api/admin/player/hunt/update",{id:Number(tr.getAttribute("data-id")),mon:val("mon"),rank:val("rank"),result:val("result"),exp:Number(val("exp"))});return}
  if(act==="hunt-del"){if(confirm("이 토벌 기록을 삭제할까요?"))post("/api/admin/player/hunt/delete",{ids:[Number(tr.getAttribute("data-id"))]});return}
  if(act==="hunt-clear"){if(confirm("이 헌터의 토벌 기록을 모두 삭제할까요?"))post("/api/admin/player/hunt/delete",{all:true});return}
}
function delPlayer(){
  var p=cache&&cache.player;if(!p)return;
  var t=prompt("["+p.hunterName+"] 캐릭터를 서버에서 영구 삭제합니다. 되돌릴 수 없습니다.\n계속하려면 헌터 네임을 정확히 입력하세요.");
  if(t===null)return;
  if(t!==p.hunterName){alert("헌터 네임이 일치하지 않아 취소했습니다.");return}
  api("POST","/api/admin/player/delete",{code:selCode,confirm:t}).then(function(r){
    if(r.ok){dirty=false;selCode=null;cache=null;$("detail").innerHTML='<div class="empty">삭제했습니다. 목록에서 다른 헌터를 선택하세요.</div>';loadAll()}
    else alert("삭제하지 못했습니다.")
  });
}

var REGS=[["city","도심"],["mine","폐광"],["river","한강변"],["temple","산사"],["port","폐항"],["gate","적월 게이트"]];
$("rregion").innerHTML='<option value="">추천 지역 없음</option>'+REGS.map(function(r){return'<option value="'+r[0]+'">'+r[1]+'</option>'}).join("");
var recDirty=false;
["rregion","rtime","rtip"].forEach(function(i){$(i).addEventListener("input",function(){recDirty=true})});
function loadRec(){
  if(recDirty)return;
  api("GET","/api/admin/rec").then(function(r){
    var c=r.rec||{};$("rregion").value=c.region||"";$("rtime").value=c.time||"";$("rtip").value=c.tip||"";
    $("rmsg").textContent=c.at?"마지막 저장 "+dt(c.at):"등록된 추천이 없습니다 (게임에는 '추천이 없습니다'로 표시).";
  });
}
$("rsave").addEventListener("click",function(){
  api("POST","/api/admin/rec/save",{region:$("rregion").value,time:$("rtime").value,tip:$("rtip").value}).then(function(r){
    if(r.ok){recDirty=false;$("rmsg").textContent="저장했습니다. 게임에는 5초 이내에 반영됩니다.";loadRec()}
    else $("rmsg").textContent=r.error==="empty"?"한 가지 이상 입력하세요.":r.error==="bad_tip"?"조언은 100자 이하여야 합니다.":r.error==="bad_time"?"시간대는 20자 이하여야 합니다.":"저장하지 못했습니다.";
  });
});
$("rclear").addEventListener("click",function(){
  if(!confirm("오늘의 추천을 삭제할까요?"))return;
  api("POST","/api/admin/rec/clear",{}).then(function(){recDirty=false;loadRec()});
});
function loadShop(){
  api("GET","/api/admin/shop").then(function(r){
    var it=r.items||[];
    $("slist").innerHTML=it.length?it.map(function(x){return'<tr data-id="'+x.id+'"><td><input class="sn" maxlength="30" value="'+esc(x.name)+'"></td><td><input class="sd" maxlength="100" value="'+esc(x.desc)+'"></td><td><input class="sp" type="number" min="0" max="9999999" step="1" style="max-width:100px" value="'+(x.price||0)+'"></td><td><button class="btn" data-sa="save">저장</button> <button class="btn" data-sa="del">삭제</button></td></tr>'}).join(""):'<tr><td colspan="4" class="muted">등록된 상점 아이템이 없습니다.</td></tr>';
  });
}
function shopErr(r){return r.error==="duplicate"?"이미 같은 이름이 있습니다.":r.error==="bad_item"?"이름을 확인하세요.":r.error==="bad_price"?"가격은 0 이상의 정수여야 합니다.":"처리하지 못했습니다."}
$("sadd").addEventListener("click",function(){
  api("POST","/api/admin/shop/save",{name:$("sname").value,desc:$("sdesc").value,price:$("sprice").value}).then(function(r){
    if(r.ok){$("sname").value="";$("sdesc").value="";$("sprice").value="";$("smsg").textContent="추가했습니다.";loadShop()}else $("smsg").textContent=shopErr(r);
  });
});
$("slist").addEventListener("click",function(e){
  var a=e.target.getAttribute&&e.target.getAttribute("data-sa");if(!a)return;
  var tr=e.target.closest("tr"),id=Number(tr.getAttribute("data-id"));
  if(a==="del"){if(!confirm("상점에서 이 아이템을 삭제할까요? (헌터가 이미 가진 아이템은 유지됩니다)"))return;
    api("POST","/api/admin/shop/delete",{id:id}).then(loadShop);return}
  api("POST","/api/admin/shop/save",{id:id,name:tr.querySelector(".sn").value,desc:tr.querySelector(".sd").value,price:tr.querySelector(".sp").value}).then(function(r){
    $("smsg").textContent=r.ok?"저장했습니다.":shopErr(r);if(r.ok)loadShop();
  });
});
$("nsend").addEventListener("click",function(){
  var t=$("ntext").value.trim();if(!t){$("nmsg").textContent="내용을 입력하세요.";return}
  if(!confirm("모든 헌터에게 이 알림을 발송할까요?"))return;
  api("POST","/api/admin/notice",{text:t}).then(function(r){
    if(r._status===201){$("ntext").value="";$("nmsg").textContent="발송했습니다.";loadOverview()}
    else $("nmsg").textContent="발송하지 못했습니다.";
  });
});
function loadAll(){loadOverview();loadRec();if(!document.activeElement||!/^(sn|sd|sp|sname|sdesc|sprice)$/.test(document.activeElement.className||document.activeElement.id))loadShop();loadList();if(selCode&&!dirty)loadDetail();var d=new Date(),p=function(n){return String(n).padStart(2,"0")};$("last").textContent="갱신 "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
// 1분마다 데이터만 다시 불러옵니다. 선택한 헌터·탭·검색어·작성 중인 알림은 그대로 유지됩니다.
setInterval(function(){if($("auto").checked&&!document.hidden&&!$("app").classList.contains("hide"))loadAll()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&$("auto").checked&&!$("app").classList.contains("hide"))loadAll()});
function boot(){
  api("GET","/api/admin/overview").then(function(r){
    if(typeof r.users!=="number"){          // 정상적인 관리자 응답이 아니면 로그인 화면을 유지합니다
      showApp(false);
      if(r._status&&r._status!==401)$("lerr").textContent="서버 응답 오류("+r._status+"): 관리자 기능이 배포되지 않았을 수 있습니다.";
      return;
    }
    showApp(true);loadAll();
  });
}
boot();
})();
</script>
</body>
</html>
