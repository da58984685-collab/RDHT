<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>赤月 관리자</title>
<style>
:root{--bg1:#0a0607;--card:#140d0f;--field:#0b0708;--text:#f3e9e7;--sub:#ab9d9b;--line:#3a1a1e;--red:#d4202e;--red2:#ff3b4a;--ok:#8fb996;--warn:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg1);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;font-size:15px}
h1,h2,h3{margin:0;font-weight:700}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
input,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--red)}
.btn{white-space:nowrap;flex:none;background:var(--red);border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font-weight:700;color:#fff}
.btn:hover{background:var(--red2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
.btn.ghost:hover{border-color:var(--red)}
.err{color:var(--red2);min-height:1.4em;font-size:.9rem;margin-top:8px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .card{width:100%;max-width:360px;display:grid;gap:12px}
#login h1{font-family:"Noto Serif TC","Nanum Myeongjo",serif;letter-spacing:.2em;text-align:center;font-size:1.6rem}
#login small{display:block;text-align:center;color:var(--sub)}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-family:"Noto Serif TC","Nanum Myeongjo",serif;letter-spacing:.14em;font-size:1.3rem}
.top h1 span{color:var(--red2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem}
.stat span{color:var(--sub);font-size:.8rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.search{display:flex;gap:8px;margin-bottom:10px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#1b1013;color:var(--sub);font-weight:500}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:#22101400;background:#2a1216}
.rk{display:inline-block;min-width:1.6em;text-align:center;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-weight:700}
.rk.S,.rk.A{color:var(--red2);border-color:var(--red)}
.muted{color:var(--sub)}
.empty{color:var(--sub);padding:18px;text-align:center}
/* detail */
.head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.head img,.head .ph{width:84px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:var(--field);flex:none}
.head h2{font-size:1.25rem}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:.9rem;margin-bottom:10px}
.kv dt{color:var(--sub)}.kv dd{margin:0;word-break:break-word}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--red)}
.bars{display:grid;gap:6px;margin-bottom:8px}
.bar{display:grid;grid-template-columns:64px 1fr 36px;gap:8px;align-items:center;font-size:.88rem}
.bar i{display:block;height:8px;background:var(--field);border-radius:4px;overflow:hidden}
.bar i b{display:block;height:100%;background:#e8e2e0}
.bar.pw i b{background:var(--red)}
.ok{color:var(--ok)}.bad{color:var(--red2)}.wait{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:.82rem}
.send{margin-top:14px}
.send textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.note{font-size:.82rem;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<section id="login">
  <form class="card" id="lf" autocomplete="off">
    <h1>赤月</h1>
    <small>관리자 전용</small>
    <input id="aid" placeholder="아이디" autocomplete="username" required>
    <input id="apw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn" type="submit">접속</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
</section>

<main id="app" class="wrap hide">
  <div class="top">
    <h1>赤月 <span>관리자</span></h1>
    <div><span class="muted" id="last" style="font-size:.82rem;margin-right:8px"></span><label class="muted" style="font-size:.82rem;margin-right:8px;cursor:pointer"><input type="checkbox" id="auto" checked style="width:auto;vertical-align:middle"> 1분마다 자동 새로고침</label><button class="btn ghost" id="refresh" type="button">새로고침</button> <button class="btn ghost" id="logout" type="button">로그아웃</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cols">
    <section class="card">
      <h2 style="margin-bottom:10px">헌터 목록</h2>
      <form class="search" id="sf"><input id="q" placeholder="헌터 네임 · 이름 · 코드 검색"><button class="btn" type="submit">검색</button></form>
      <div class="tw"><table><thead><tr><th>헌터</th><th>등급</th><th>Lv</th><th>토벌</th><th>지역</th></tr></thead><tbody id="plist"></tbody></table></div>
      <div class="note">행을 누르면 상세 정보가 열립니다.</div>
    </section>
    <section class="card" id="detail"><div class="empty">왼쪽 목록에서 헌터를 선택하세요.</div></section>
  </div>
  <section class="card send">
    <h3 style="margin-bottom:8px">시스템 알림 발송 <span class="muted" style="font-weight:400;font-size:.85rem">(서버 내 모든 헌터에게 전달)</span></h3>
    <textarea id="ntext" maxlength="1000" placeholder="알림 내용 (최대 1000자)"></textarea>
    <div class="row"><button class="btn" id="nsend" type="button">발송</button><span id="nmsg" class="muted"></span></div>
  </section>
</main>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function api(m,u,b){
  return fetch(u,{method:m,credentials:"same-origin",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(j){j._status=r.status;return j})})
    .catch(function(){return{error:"network",_status:0}});
}
function dt(t){if(!t)return"-";var d=new Date(t),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
var RES={success:["토벌 성공","ok"],fail:["토벌 실패","bad"],pending:["S급 결과 대기","wait"]};
var selCode=null,tab="info",cache=null;

function showApp(on){$("login").classList.toggle("hide",on);$("app").classList.toggle("hide",!on)}

$("lf").addEventListener("submit",function(e){
  e.preventDefault();$("lerr").textContent="";
  api("POST","/api/admin/login",{id:$("aid").value,password:$("apw").value}).then(function(r){
    if(r.ok){$("apw").value="";boot()}
    else $("lerr").textContent=r.error==="rate_limited"?"시도 횟수가 많습니다. 잠시 후 다시 시도하세요.":r.error==="admin_disabled"?"관리자 계정이 설정되지 않았습니다.":r.error==="network"?"네트워크 오류입니다.":"아이디 또는 비밀번호가 올바르지 않습니다.";
  });
});
$("logout").addEventListener("click",function(){api("POST","/api/admin/logout",{}).then(function(){location.reload()})});
$("refresh").addEventListener("click",function(){loadAll()});
$("sf").addEventListener("submit",function(e){e.preventDefault();loadList()});

function loadOverview(){
  api("GET","/api/admin/overview").then(function(r){
    if(r._status===401){showApp(false);return}
    var rk={};(r.ranks||[]).forEach(function(x){rk[x.rank]=x.c});
    var h={};(r.hunts||[]).forEach(function(x){h[x.result]=x.c});
    var cells=[["전체 헌터",r.users],["토벌 성공",h.success||0],["토벌 실패",h.fail||0],["S급 결과 대기",r.pendingS],["발송한 알림",r.notices],
      ["등급 분포","F"+(rk.F||0)+" E"+(rk.E||0)+" D"+(rk.D||0)+" C"+(rk.C||0)+" B"+(rk.B||0)+" A"+(rk.A||0)]];
    $("stats").innerHTML=cells.map(function(c){return'<div class="stat"><b>'+esc(c[1])+"</b><span>"+esc(c[0])+"</span></div>"}).join("");
  });
}
function loadList(){
  api("GET","/api/admin/players?q="+encodeURIComponent($("q").value)).then(function(r){
    if(r._status===401){showApp(false);return}
    var ps=r.players||[];
    $("plist").innerHTML=ps.length?ps.map(function(p){
      return'<tr data-c="'+esc(p.code)+'"'+(p.code===selCode?' class="sel"':"")+"><td>"+esc(p.hunterName)+'<div class="muted" style="font-size:.78rem">'+esc(p.code)+'</div></td><td><span class="rk '+esc(p.rank)+'">'+esc(p.rank)+"</span></td><td>"+p.lv+"</td><td>"+p.kills+"</td><td>"+esc(p.region)+"</td></tr>";
    }).join(""):'<tr><td colspan="5" class="empty">헌터가 없습니다.</td></tr>';
  });
}
$("plist").addEventListener("click",function(e){
  var tr=e.target.closest("tr[data-c]");if(!tr)return;
  selCode=tr.getAttribute("data-c");tab="info";
  Array.prototype.forEach.call($("plist").children,function(x){x.classList.toggle("sel",x===tr)});
  loadDetail();
});
function loadDetail(){
  if(!selCode)return;
  api("GET","/api/admin/player?code="+encodeURIComponent(selCode)).then(function(r){
    if(r._status===401){showApp(false);return}
    if(r.error){$("detail").innerHTML='<div class="empty">정보를 불러오지 못했습니다.</div>';return}
    cache=r;renderDetail();
  });
}
function table(cols,rows,emptyMsg){
  if(!rows.length)return'<div class="empty">'+esc(emptyMsg)+"</div>";
  return'<div class="tw" style="max-height:340px"><table><thead><tr>'+cols.map(function(c){return"<th>"+esc(c)+"</th>"}).join("")+"</tr></thead><tbody>"+rows.join("")+"</tbody></table></div>";
}
function renderDetail(){
  var r=cache,p=r.player,st=p.stats||{};
  var counts={};(r.counts||[]).forEach(function(x){counts[x.result]=x.c});
  var h='<div class="head">'+(p.image?'<img alt="" src="'+esc(p.image)+'">':'<div class="ph"></div>')+
    '<div><h2>'+esc(p.hunterName)+' <span class="rk '+esc(p.rank)+'">'+esc(p.rank)+'</span></h2><div class="muted">'+esc(p.code)+" · Lv."+p.lv+" · EXP "+p.exp+"</div></div></div>";
  h+='<div class="tabs">'+[["info","정보 · 스탯"],["items","아이템"],["acq","습득 정보"],["hunt","토벌 기록"]].map(function(t){return'<button class="tab'+(tab===t[0]?" on":"")+'" data-t="'+t[0]+'" type="button">'+t[1]+"</button>"}).join("")+"</div>";
  if(tab==="info"){
    h+='<dl class="kv"><dt>이름</dt><dd>'+esc(p.name)+"</dd><dt>성별 · 나이</dt><dd>"+esc(p.gender)+" · "+esc(p.age)+"세</dd><dt>현재 지역</dt><dd>"+esc(p.region)+"</dd><dt>친구 수</dt><dd>"+p.friends+"명</dd><dt>가입일</dt><dd>"+dt(p.created)+"</dd><dt>성격</dt><dd>"+esc(p.personality)+"</dd></dl>";
    h+=(p.traits&&p.traits.length?'<div class="chips">'+p.traits.map(function(t){return'<span class="chip">'+esc(t)+"</span>"}).join("")+"</div>":"");
    var labels=[["power","전투력"],["hp","체력"],["str","근력"],["agi","민첩"],["luck","행운"]];
    var shown=false,bars="";
    Object.keys(st).forEach(function(k){
      if(k==="taint")return;
      var lab=({hp:"체력",str:"근력",agi:"민첩",dex:"민첩",luck:"행운",lck:"행운",taint:"이능",power:"전투력"})[k]||k;
      var v=Number(st[k])||0;shown=true;
      bars+='<div class="bar"><span>'+esc(lab)+'</span><i><b style="width:'+Math.max(2,Math.min(100,v*2.5))+'%"></b></i><span>'+esc(st[k])+"</span></div>";
    });
    h+='<h3 style="font-size:.95rem;margin:8px 0 6px">스탯</h3><div class="bars"><div class="bar pw"><span>전투력</span><i><b style="width:'+Math.min(100,p.lv*5)+'%"></b></i><span>Lv.'+p.lv+"</span></div>"+bars+"</div>";
    if(r.pendingS&&r.pendingS.length)h+='<h3 style="font-size:.95rem;margin:10px 0 4px">S급 결과 대기</h3>'+r.pendingS.map(function(x){return'<div class="muted">'+esc(x.mon)+" — "+dt(x.at)+" 공개</div>"}).join("");
  }else if(tab==="items"){
    h+=table(["아이템","수량"],(r.items||[]).map(function(i){return"<tr><td>"+esc(i.item)+"</td><td>"+i.qty+"</td></tr>"}),"보유한 아이템이 없습니다. (상점·아이템 시스템 연결 후 표시됩니다)");
  }else if(tab==="acq"){
    h+=table(["시각","종류","내용","수량","출처"],(r.acquired||[]).map(function(a){return"<tr><td>"+dt(a.at)+"</td><td>"+(a.kind==="exp"?"경험치":esc(a.kind))+"</td><td>"+esc(a.name)+"</td><td>"+a.qty+"</td><td>"+esc(a.source)+"</td></tr>"}),"습득 기록이 없습니다.");
  }else{
    h+='<div class="chips"><span class="chip ok">성공 '+(counts.success||0)+'</span><span class="chip bad">실패 '+(counts.fail||0)+'</span><span class="chip wait">S급 대기 '+(counts.pending||0)+"</span></div>";
    h+=table(["시각","몬스터","등급","결과","EXP"],(r.hunts||[]).map(function(x){var s=RES[x.result]||[x.result,""];return"<tr><td>"+dt(x.at)+"</td><td>"+esc(x.mon)+'</td><td><span class="rk '+esc(x.rank)+'">'+esc(x.rank)+'</span></td><td class="'+s[1]+'">'+esc(s[0])+"</td><td>"+(x.exp_gain?"+"+x.exp_gain:"-")+"</td></tr>"}),"토벌 기록이 없습니다.");
    h+='<div class="note">최근 200건까지 표시합니다. 이 기록은 관리자 창 추가 이후의 토벌부터 쌓입니다.</div>';
  }
  $("detail").innerHTML=h;
}
$("detail").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b||!cache)return;tab=b.getAttribute("data-t");renderDetail()});

$("nsend").addEventListener("click",function(){
  var t=$("ntext").value.trim();if(!t){$("nmsg").textContent="내용을 입력하세요.";return}
  if(!confirm("모든 헌터에게 이 알림을 발송할까요?"))return;
  api("POST","/api/admin/notice",{text:t}).then(function(r){
    if(r._status===201){$("ntext").value="";$("nmsg").textContent="발송했습니다.";loadOverview()}
    else $("nmsg").textContent="발송하지 못했습니다.";
  });
});
function loadAll(){loadOverview();loadList();if(selCode)loadDetail();var d=new Date(),p=function(n){return String(n).padStart(2,"0")};$("last").textContent="갱신 "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
// 1분마다 데이터만 다시 불러옵니다. 선택한 헌터·탭·검색어·작성 중인 알림은 그대로 유지됩니다.
setInterval(function(){if($("auto").checked&&!document.hidden&&!$("app").classList.contains("hide"))loadAll()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&$("auto").checked&&!$("app").classList.contains("hide"))loadAll()});
function boot(){
  api("GET","/api/admin/overview").then(function(r){
    if(r._status===401||r.error){showApp(false);return}
    showApp(true);loadAll();
  });
}
boot();
})();
</script>
</body>
</html>
